name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certcenter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: configcenter
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Go linter
        run: |
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: make check
      - run: TMPDIR="$PWD/.tmp" go test -tags=mysql ./internal/server -run TestMySQLStore -count=1
      - run: make build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGE: production
      SERVERLESS_PLATFORM_VENDOR: tencent
      SCF_REGION: ${{ vars.SCF_REGION }}
      SCF_VPC_ID: ${{ vars.SCF_VPC_ID }}
      SCF_SUBNET_ID: ${{ vars.SCF_SUBNET_ID }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p .tmp
      - run: npm ci
      - name: Build Linux deployment package
        run: |
          npm run build
          mkdir -p .tmp/scf
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .tmp/scf/certcenter ./cmd/certcenter
          cp scf_bootstrap .tmp/scf/scf_bootstrap
          chmod +x .tmp/scf/scf_bootstrap
      - name: Install deployment CLI
        run: npm install --prefix .tmp/scf-cli --no-audit --no-fund serverless-cloud-framework@1.4.1
      - name: Prepare runtime configuration
        env:
          RUNTIME_ENV: ${{ secrets.SCF_RUNTIME_ENV }}
        run: |
          test -n "$SCF_REGION"
          test -n "$SCF_VPC_ID"
          test -n "$SCF_SUBNET_ID"
          test -n "$RUNTIME_ENV"
          umask 077
          printf '%s\n' "$RUNTIME_ENV" > .tmp/scf/.env.local
          mkdir -p .tmp/scf-project
          sed 's|src: ./.tmp/scf|src: ../scf|' serverless.yml > .tmp/scf-project/serverless.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare versioned release
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          python -m venv .tmp/scf-venv
          .tmp/scf-venv/bin/pip install tencentcloud-sdk-python-scf==3.1.100
          .tmp/scf-venv/bin/python tools/scf-release.py --remember
      - name: Deploy Tencent SCF
        working-directory: .tmp/scf-project
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          test -n "$TENCENT_SECRET_ID"
          test -n "$TENCENT_SECRET_KEY"
          previous=$(cat ../scf-previous-version)
          if ! ../scf-cli/node_modules/.bin/scf deploy --stage production --inputs aliasFunctionVersion="$previous" aliasName='$DEFAULT' additionalVersionWeights='[]' > ../scf-deploy.log 2>&1; then
            printf '%s\n' 'SCF deployment failed; inspect deployment events in Tencent Cloud.'
            exit 1
          fi
      - name: Publish version and keep one instance running
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: .tmp/scf-venv/bin/python tools/scf-release.py
      - name: Verify deployed login page
        env:
          SCF_PUBLIC_URL: ${{ vars.SCF_PUBLIC_URL }}
        run: |
          test -n "$SCF_PUBLIC_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 65 "$SCF_PUBLIC_URL/login" -o .tmp/scf-login.html
          grep -q 'page-data' .tmp/scf-login.html
      - name: Remove runtime configuration and packages
        if: always()
        run: rm -rf .tmp/scf .tmp/scf-project .tmp/scf-login.html .tmp/scf-deploy.log .tmp/scf-previous-version
