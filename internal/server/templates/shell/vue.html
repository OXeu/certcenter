<!doctype html>
<html lang="{{.Lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <link rel="icon" type="image/webp" sizes="16x16" href="/static/brand/icon-16.webp" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/static/brand/icon-32.webp" />
    <link rel="icon" type="image/webp" sizes="48x48" href="/static/brand/icon-48.webp" />
    <link rel="icon" type="image/webp" sizes="192x192" href="/static/brand/icon-192.webp" />
    <link rel="icon" type="image/webp" sizes="512x512" href="/static/brand/icon-512.webp" />
    {{range frontendStyles}}
    <link rel="stylesheet" href="/static/app/{{.}}" />
    {{end}}
    <script type="module" src="{{frontendScript}}"></script>
  </head>
  <body>
    <div id="app"></div>
    <script id="page-data" type="application/json">
      {{.PageJSON}}
    </script>
  </body>
</html>
